name: Build ViralClip Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Dynamic App Version
        id: app_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_CODE=$COMMIT_COUNT
          VERSION_NAME="1.0.${COMMIT_COUNT}"
          TAG_NAME="v1.0.${COMMIT_COUNT}"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Building ViralClip Studio $VERSION_NAME (Code: $VERSION_CODE, Commit: $SHORT_SHA)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Compile Kotlin Code
        working-directory: ./android
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug -PversionCode=${{ steps.app_version.outputs.version_code }} -PversionName=${{ steps.app_version.outputs.version_name }} --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralClip-Studio-v${{ steps.app_version.outputs.version_code }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release APK Asset
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-release.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ViralClip-Studio-${{ steps.app_version.outputs.tag_name }}.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/ViralClip-Studio.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag_name }}
          name: ViralClip Studio ${{ steps.app_version.outputs.version_name }} (Android)
          body: |
            ### ViralClip Studio Native Android App (${{ steps.app_version.outputs.version_name }})
            - **Build Code:** `${{ steps.app_version.outputs.version_code }}`
            - **Commit:** `${{ steps.app_version.outputs.short_sha }}`
            - **Automated Dynamic Versioning:** Every commit increments the app version and package code automatically.
            - **Creator Authentication Gate:** Mandatory login restricted to admin-approved accounts.
            - **AndroidX Media3 Transformer Engine:** Crash-proof hardware video cropping (9:16) and trimming.
            - **Auto Face-Centered Framing:** Smart subject tracking centers speakers automatically when converting 16:9 to 9:16 Shorts.
            - **Local Gallery Picker & 1-Tap Blueprint Copy:** Pick downloaded video clips or copy viral timestamps directly to clipboard.
          files: |
            android/app/build/outputs/apk/debug/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/ViralClip-Studio-${{ steps.app_version.outputs.tag_name }}.apk
            android/app/build/outputs/apk/debug/ViralClip-Studio.apk
