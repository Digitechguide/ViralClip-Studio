name: Build ViralClip Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralClip-Studio-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare Release APK Asset
        if: github.ref == 'refs/heads/main'
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/app-release.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: ViralClip Studio v1.0.0 (Android)
          body: |
            ### ViralClip Studio Native Android App (v1.0.0)
            - **Hardware-Accelerated Video Rendering:** On-device FFmpegKit 9:16 vertical video cropping (1080x1920 60fps).
            - **Google Gemini 1.5 Flash:** Viral hook detection, punchline extraction, and audience retention analysis.
            - **YouTube Share Sheet Receiver:** Direct import from the YouTube Android app via Share.
            - **Gallery Auto-Indexing:** 1-tap export directly into Android MediaStore.
          files: |
            android/app/build/outputs/apk/debug/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
