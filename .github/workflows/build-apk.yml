name: Build ViralClip Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute Dynamic App Version
        id: app_version
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_CODE=$COMMIT_COUNT
          VERSION_NAME="1.0.${COMMIT_COUNT}"
          TAG_NAME="v1.0.${COMMIT_COUNT}"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Building ViralClip Studio $VERSION_NAME (Code: $VERSION_CODE, Commit: $SHORT_SHA)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Compile Kotlin Code
        working-directory: ./android
        run: ./gradlew compileDebugKotlin --stacktrace 2>&1 | tee ../compile_output.txt

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug -PversionCode=${{ steps.app_version.outputs.version_code }} -PversionName=${{ steps.app_version.outputs.version_name }} --stacktrace 2>&1 | tee ../assemble_output.txt

      - name: Save Error Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B ci-error-log
          git add compile_output.txt assemble_output.txt || true
          git commit -m "ci: failure diagnostic logs" || true
          git push origin ci-error-log --force || true

      - name: Locate and Prepare Release APK Assets
        run: |
          APK_FILE=$(find android/app/build/outputs -name "*.apk" | head -n 1)
          echo "Discovered built APK: $APK_FILE"
          mkdir -p android/app/build/outputs/apk/debug
          cp "$APK_FILE" android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK_FILE" android/app/build/outputs/apk/debug/app-release.apk
          cp "$APK_FILE" "android/app/build/outputs/apk/debug/ViralClip-Studio-${{ steps.app_version.outputs.tag_name }}.apk"
          cp "$APK_FILE" android/app/build/outputs/apk/debug/ViralClip-Studio.apk
          ls -lh android/app/build/outputs/apk/debug/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViralClip-Studio-v${{ steps.app_version.outputs.version_code }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.app_version.outputs.tag_name }}
          name: ViralClip Studio ${{ steps.app_version.outputs.version_name }} (Android)
          body: |
            ### ViralClip Studio Native Android App (${{ steps.app_version.outputs.version_name }})
            - **Build Code:** `${{ steps.app_version.outputs.version_code }}`
            - **Commit:** `${{ steps.app_version.outputs.short_sha }}`
            - **Automated Dynamic Versioning:** Every commit increments the app version and package code automatically.
            - **Custom Logo & Watermark Studio:** Add custom PNG channel logo, @handle watermark, dynamic opacity, and 4-corner positioning.
            - **In-App Video Player & Precision Clipper:** Preview video directly inside the app, scrub start/end times with +/-1s precision micro-buttons and 15s/30s/45s/60s presets.
            - **Recently Generated Shorts Library:** Instant playback modal, 1-tap native Android share sheet (Shorts, Reels, TikTok), and MediaStore sync.
            - **Auto Face-Centered Framing:** Smart subject tracking centers primary speakers automatically when converting 16:9 to 9:16 Shorts.
          files: |
            android/app/build/outputs/apk/debug/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/ViralClip-Studio-${{ steps.app_version.outputs.tag_name }}.apk
            android/app/build/outputs/apk/debug/ViralClip-Studio.apk
